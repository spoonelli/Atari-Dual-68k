name: Build core (Quartus)

# Compiles the Cyclone V bitstream inside theypsilon/quartus-lite-c5:18.1 — a
# community-maintained Quartus Lite 18.1 + Cyclone V image (purpose-built for Pocket
# cores). Our own install was subtly incomplete (quartus_map crashed even on native
# x86); this image is known-good. Runs on the native-x86 runner, so no emulation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile ap_core
        run: |
          docker run --rm -v "$PWD":/work -w /work/src/fpga \
            theypsilon/quartus-lite-c5:18.1 \
            quartus_sh --flow compile ap_core

      - name: Bit-reverse .rbf -> .rbf_r
        run: |
          test -f src/fpga/output_files/ap_core.rbf
          mkdir -p output
          python3 support/reverse_bits.py \
            src/fpga/output_files/ap_core.rbf output/bitstream.rbf_r

      - name: Upload bitstream
        uses: actions/upload-artifact@v4
        with:
          name: bitstream
          path: |
            output/bitstream.rbf_r
            src/fpga/output_files/ap_core.rbf
