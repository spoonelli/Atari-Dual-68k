name: Build core (Quartus)

# Compiles the Cyclone V bitstream inside theypsilon/quartus-lite-c5:18.1 — a
# community-maintained Quartus Lite 18.1 + Cyclone V image (purpose-built for Pocket
# cores). Our own install was subtly incomplete (quartus_map crashed even on native
# x86); this image is known-good. Runs on the native-x86 runner, so no emulation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile ap_core
        run: |
          docker run --rm -v "$PWD":/work -w /work/src/fpga \
            theypsilon/quartus-lite-c5:18.1 \
            quartus_sh --flow compile ap_core

      # CLKFIX-106: until now this workflow had NO timing gate -- "never ship
      # negative slack" was enforced only by a human remembering to grep the
      # log. This gate parses the STA summary tables by COLUMN (the slack is
      # the second field; a regex anchored at line start silently passed a
      # -5.538 ns build on the MiSTer side) and refuses to certify if any
      # expected table is missing, so it cannot report a clean bill of health
      # without having actually looked. Verified against synthetic good, bad
      # and truncated reports before being trusted.
      - name: Timing gate (fail on negative slack)
        run: |
          test -f src/fpga/output_files/ap_core.sta.rpt
          python3 support/check_slack.py src/fpga/output_files/ap_core.sta.rpt

      - name: Bit-reverse .rbf -> .rbf_r
        run: |
          test -f src/fpga/output_files/ap_core.rbf
          mkdir -p output
          python3 support/reverse_bits.py \
            src/fpga/output_files/ap_core.rbf
            src/fpga/output_files/ap_core.sta.rpt output/bitstream.rbf_r

      - name: Upload bitstream
        uses: actions/upload-artifact@v4
        with:
          name: bitstream
          path: |
            output/bitstream.rbf_r
            src/fpga/output_files/ap_core.rbf
            src/fpga/output_files/ap_core.sta.rpt
