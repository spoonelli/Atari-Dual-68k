name: Build core (Quartus)

# Compiles the Cyclone V bitstream. Runs the compile INSIDE our Quartus Docker image
# (docker/Dockerfile) — the same image validated locally to contain the Cyclone V
# device. On the native-x86 GitHub runner there is no emulation, so quartus_map runs
# cleanly. The image layers (incl. the ~3 GB Quartus download) are cached via GHA so
# only the first build is slow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Quartus image (cached layers)
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: quartus-escape:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compile ap_core
        run: |
          docker run --rm -v "$PWD":/work -w /work/src/fpga quartus-escape:local \
            quartus_sh --flow compile ap_core

      - name: Bit-reverse .rbf -> .rbf_r
        run: |
          test -f src/fpga/output_files/ap_core.rbf
          mkdir -p output
          python3 support/reverse_bits.py \
            src/fpga/output_files/ap_core.rbf output/bitstream.rbf_r

      - name: Upload bitstream
        uses: actions/upload-artifact@v4
        with:
          name: bitstream
          path: |
            output/bitstream.rbf_r
            src/fpga/output_files/ap_core.rbf
