name: Build MiSTer core (Quartus)

# Compiles the DE10-Nano bitstream inside theypsilon/quartus-lite-c5:18.1, the
# same container the Pocket build uses. Runs on the native-x86 hosted runner:
# on Apple Silicon the container runs under emulation and quartus_map takes
# well over half an hour, so CI is the reliable path.
#
# NOTE: MiSTer officially targets Quartus 17.0.2 Standard. This image is 18.1
# Lite; src/mister/sys/pll_q18.qip exists for exactly that reason. See
# docs/MISTER.md.

on:
  push:
    branches: [main, mister-port, mister-112]
  pull_request:
  workflow_dispatch:

jobs:
  # VSHAD3-112, in its OWN job so it runs alongside Quartus instead of in front
  # of it.
  #
  # It was briefly a step in `build`, sitting between the cheap gates and the
  # compile, and that was a mistake worth recording: the other three
  # pre-Quartus gates cost 0s, 47s and 11s, and this one cost TWENTY-PLUS
  # MINUTES on the hosted runner (measured, run 32815564898). Putting it in the
  # "fast fail before spending 30 minutes in Quartus" slot roughly doubled the
  # time to a bitstream while adding nothing to that slot's purpose - it is a
  # GHDL elaboration of the whole dual-68000 machine, four configurations deep,
  # not a boundary check.
  #
  # As a parallel job it still blocks the workflow's overall conclusion, so it
  # gates exactly as hard, and the bitstream is ready when Quartus says so.
  vshad3:
    name: Partial ROM shadow + runtime toggle (tb_vshad3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      # The 16 KB partial shadow decode and its runtime toggle both live in
      # escape_core.vhd, which the MiSTer build compiles, and the MiSTer top
      # now drives vshad3_on from CONF_STR bit 8. Each of the four rows
      # measures CPU clocks per fetch, so each is a behavioural discriminator
      # rather than an assertion: 5.015 on the BRAM path, 4.015 on the
      # fastpath.
      - name: Partial ROM shadow + runtime toggle
        run: ./sim/run_vshad3_tb.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Fast fail before spending 30 minutes in Quartus: the Verilog->VHDL
      # boundary is only validated late in the compile, and the shared machine
      # RTL moves under this port (BUILD 103 added five ee_* ports).
      - name: Check escape_core port list
        run: python3 src/mister/check_ports.py

      # PFRESET-107 regression. BUILD 105 shipped a playfield graphics channel
      # that wedged during the ROM download and never fetched again - a flat
      # playfield on hardware, with no compile-time or STA symptom whatsoever.
      # This bench counts the fetches the SDRAM arbiter actually serves and
      # fails at zero, so the regression cannot ship silently a second time.
      - name: Playfield fetch service (tb_mister_pf)
        run: ./sim/run_mister_pf_tb.sh

      # ---------------------------------------------------------------------
      # BUILD 112: the CHEAP shared-RTL gates. Each drives a file this
      # workflow actually compiles into the DE10-Nano bitstream, which is the
      # only reason they belong in THIS workflow rather than the Pocket one,
      # and each finishes in seconds, which is the only reason they belong
      # AHEAD of Quartus. Measured on the hosted runner: check_ports 0s,
      # tb_mister_pf 47s, tb_stain 11s, tb_sdram_refresh 8s. The slow one
      # (tb_vshad3, 20+ min) is a parallel job above - keep it that way, and
      # keep anything else over ~2 minutes out of this list.
      #
      # Deliberately NOT added: sim/run_pf_reset_tb.sh. It slices blocks out
      # of src/fpga/core/core_top.v, which files.qip does not compile - it is
      # a POCKET gate and putting it here would make this workflow's name a
      # lie. It is currently wired into no workflow at all; that gap is real
      # and is recorded in docs/MISTER.md rather than papered over here.
      # ---------------------------------------------------------------------

      # GFXDASH-3 two-frame line-buffer ghost. Drives escape_mob.v's
      # self-clearing readout AND escape_stain.v, both compiled below by
      # files.qip. Proven able to fail: reverting the self-clearing write
      # makes it report 226 mismatching pixels concentrated in cases D and E.
      - name: Line-buffer ghost + stain automaton (tb_stain)
        run: ./sim/run_stain_tb.sh

      # REFRESH-112. sdram_simple.v is the ONLY memory controller on this
      # platform - the playfield is on this bus too - so a refresh interval
      # out of JEDEC spec is strictly worse here than on the Pocket. The
      # bench carries its own out-of-spec negative controls (250/48 and the
      # old 224/48) and reports them as FAIL in the same run that passes the
      # shipping 160/48, so it cannot silently match nothing.
      - name: SDRAM refresh interval vs JEDEC (tb_sdram_refresh)
        run: ./sim/run_sdram_refresh_tb.sh

      - name: Compile Arcade-Escape
        run: |
          docker run --rm -v "$PWD":/work -w /work/src/mister \
            theypsilon/quartus-lite-c5:18.1 \
            quartus_sh --flow compile Arcade-Escape

      - name: Report timing and resources
        if: always()
        run: |
          echo "=== Fitter resource usage ==="
          sed -n '1,60p' src/mister/output_files/Arcade-Escape.fit.summary || true
          echo "=== Fmax / Setup / Hold summaries ==="
          awk '/; Fmax Summary/,/; Minimum Pulse Width Summary/' \
            src/mister/output_files/Arcade-Escape.sta.rpt || true

      - name: Worst-path timing detail
        if: always()
        run: |
          docker run --rm -v "$PWD":/work -w /work/src/mister \
            theypsilon/quartus-lite-c5:18.1 \
            quartus_sta -t timing_report.tcl Arcade-Escape || true

      # Hold-path detail, uploaded with the bitstream. The margin warning the
      # slack gate prints is useless without the path it is warning about;
      # this is the reporter that names it (support/report_hold_paths.tcl,
      # arrived with the tas-atomic merge).
      - name: Hold-path detail
        if: always()
        run: |
          docker run --rm -v "$PWD":/work -w /work/src/mister \
            theypsilon/quartus-lite-c5:18.1 \
            quartus_sta -t ../../support/report_hold_paths.tcl Arcade-Escape || true

      # BUILD 112: switched from src/mister/check_slack.py (now deleted) to
      # the shared support/check_slack.py.
      #
      # BE PRECISE ABOUT WHY. The MiSTer-local copy was NARROW, not broken -
      # it FAILS CLOSED, so it was never one of this project's silent-pass
      # gates. Measured on synthetic fixtures, both versions agree exactly on
      # the bare single-corner report form: clean passes, one -5.538 row
      # fails. The differences are:
      #   * it anchored each table name to the leading ';', so a multi-corner
      #     heading ("; Slow 1100mV 85C Model Setup Summary ;") matched
      #     nothing and it refused to certify the report at all - safe, but
      #     it would have blocked this build the moment Quartus emitted more
      #     than one timing model;
      #   * it stopped at the FIRST match per table, i.e. one corner. A
      #     fixture whose ONLY negative row is at the third corner passes it
      #     and fails the shared version;
      #   * it has no "tables present but zero parseable rows" trap, which is
      #     the failure mode where a report-format change turns a gate into a
      #     no-op that still prints a pass;
      #   * it prints no evidence. The shared one prints the tightest row per
      #     check and flags thin-but-positive margins against per-kind floors,
      #     so a pass is auditable rather than asserted.
      - name: Fail on negative slack
        if: always()
        run: python3 support/check_slack.py src/mister/output_files/Arcade-Escape.sta.rpt

      # The MiSTer release surface is three files and none of them can carry
      # ROM data: a bitstream, a CRC-only .mra manifest, and a markdown file.
      # That is much smaller than the Pocket's (support/package.sh copies whole
      # Assets/ and Platforms/ trees and needs four guards plus
      # support/test_package_guards.sh to police them). It is checked anyway,
      # because "it cannot happen" is how the Pocket's zero-ROM hole stayed
      # open: a 2,228,224-byte ROM renamed gfxdata.bin walked into a release
      # zip past a guard that no code path could trigger.
      - name: Stage release files
        run: |
          mkdir -p mister-release
          # MiSTer naming convention: CoreName_YYYYMMDD.rbf. The .mra's
          # <rbf>escape</rbf> matches escape_*.rbf by prefix, so the dated
          # name needs no manifest change.
          cp src/mister/output_files/Arcade-Escape.rbf \
             "mister-release/escape_$(date -u +%Y%m%d).rbf"
          cp src/mister/releases/*.mra mister-release/
          # user-facing install README; docs/MISTER.md stays the engineering record
          cp src/mister/releases/README.md mister-release/README.md
          # licence texts must accompany the binary (GPL-3.0; NOTICE.md is
          # the third-party inventory)
          cp LICENSE   mister-release/LICENSE.txt
          cp NOTICE.md mister-release/NOTICE.md

      - name: Release must contain no ROM data
        run: |
          set -eu
          fail=0
          # 1. nothing but the three expected kinds of file
          while IFS= read -r f; do
            case "$f" in
              *.rbf|*.mra|*.md|*/LICENSE.txt) ;;   # LICENSE.txt: the GPL text, staged since the licence-packaging fix
              *) echo "UNEXPECTED FILE IN RELEASE: $f" >&2; fail=1 ;;
            esac
          done <<EOF
          $(find mister-release -type f)
          EOF
          # 2. the .mra is a text manifest: ASCII only, and no <part> may carry
          #    inline payload. A part with data between its tags is a ROM byte.
          for m in mister-release/*.mra; do
            sz=$(wc -c < "$m")
            echo "mra: $m ($sz bytes)"
            # Count bytes outside tab/LF/CR + printable ASCII. Done with tr,
            # not `grep -P`: BSD grep has no -P, so a -P check silently errors
            # out and the `if` reads as "clean". That is a gate that cannot
            # fail on half the machines anyone would run it on.
            nonascii=$(LC_ALL=C tr -d '\011\012\015\040-\176' < "$m" | wc -c | tr -d ' ')
            echo "  non-ASCII bytes: $nonascii"
            if [ "$nonascii" -ne 0 ]; then
              echo "NON-ASCII BYTES IN $m - a manifest must be text" >&2; fail=1
            fi
            if LC_ALL=C tr -d '\n' < "$m" | grep -qE '<part>[^<]{16,}</part>'; then
              echo "INLINE <part> PAYLOAD IN $m" >&2; fail=1
            fi
            if [ "$sz" -gt 65536 ]; then
              echo "MRA IS $sz BYTES - far too big to be CRC references" >&2; fail=1
            fi
          done
          # 3. prove this check is looking at something rather than matching
          #    nothing: the manifest must actually carry CRC references.
          n=$(grep -o 'crc="' mister-release/*.mra | wc -l | tr -d ' ')
          echo "crc= references: $n"
          [ "$n" -ge 20 ] || { echo "ONLY $n crc= REFS - is this really the manifest?" >&2; fail=1; }
          exit $fail

      - name: Upload MiSTer core
        uses: actions/upload-artifact@v4
        with:
          name: mister-core
          path: |
            mister-release/
            src/mister/output_files/Arcade-Escape.fit.summary
            src/mister/output_files/Arcade-Escape.sta.rpt
            src/mister/output_files/Arcade-Escape.hold_paths.rpt
